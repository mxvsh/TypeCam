name: OBS plugin release

# Push a tag like `plugin/v0.2.0` to build the macOS plugin and publish a GitHub Release.
# (iOS app tags are `ios/v*` and are created by scripts/release.sh; they don't trigger this.)
on:
  push:
    tags: ["plugin/v*"]
  workflow_dispatch: # build only, uploads the zip as a workflow artifact

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    env:
      # Optional. Without these the plugin is ad-hoc signed and not notarized.
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#plugin/v}"
          else
            VERSION="$(jq -r .version obs-plugin/buildspec.json)-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The tag is the source of truth for the plugin version.
          jq --arg v "${VERSION%-dev}" '.version = $v' obs-plugin/buildspec.json > buildspec.tmp
          mv buildspec.tmp obs-plugin/buildspec.json

      - name: Cache OBS sources and deps
        uses: actions/cache@v4
        with:
          path: obs-plugin/.deps
          key: obs-deps-${{ hashFiles('obs-plugin/buildspec.json') }}

      - name: Import signing certificate
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$RUNNER_TEMP/build_certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/build_certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046  # word splitting is intended: one argument per keychain
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')
          test -n "$IDENTITY"
          echo "CODESIGN_IDENT=$IDENTITY" >> "$GITHUB_ENV"
          echo "CODESIGN_TEAM=$APPLE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Configure
        working-directory: obs-plugin
        run: cmake --preset macos

      - name: Build
        working-directory: obs-plugin
        run: cmake --build --preset macos

      - name: Package
        id: package
        working-directory: obs-plugin
        run: |
          PLUGIN=build_macos/RelWithDebInfo/obs-typecam.plugin
          test -d "$PLUGIN"
          codesign --verify --deep --strict "$PLUGIN"
          lipo -archs "$PLUGIN/Contents/MacOS/obs-typecam"

          ZIP="obs-typecam-${{ steps.version.outputs.version }}-macos-universal.zip"
          if [[ -n "$BUILD_CERTIFICATE_BASE64" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            ditto -c -k --keepParent "$PLUGIN" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
            xcrun stapler staple "$PLUGIN"
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi
          ditto -c -k --keepParent "$PLUGIN" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "zip=obs-plugin/$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-typecam-macos
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256

      - name: Write release notes
        if: github.ref_type == 'tag'
        run: |
          {
            echo "TypeCam OBS plugin ${{ steps.version.outputs.version }} for macOS 13+ and OBS 31+ (universal: Apple silicon and Intel)."
            echo
            echo "Get the iPhone app from the [App Store](https://apps.apple.com/us/app/typecam-obs-camera/id6821537950)."
            echo
            echo "### Install"
            echo
            echo "1. Quit OBS."
            echo "2. Unzip and move \`obs-typecam.plugin\` to \`~/Library/Application Support/obs-studio/plugins/\`."
            echo "3. Open OBS and add a **TypeCam (iPhone)** source."
            if [[ "${{ steps.package.outputs.notarized }}" != "true" ]]; then
              echo
              echo "This build is not notarized. If macOS blocks it, run:"
              echo
              echo '```sh'
              echo 'xattr -dr com.apple.quarantine ~/Library/Application\ Support/obs-studio/plugins/obs-typecam.plugin'
              echo '```'
            fi
          } > release-notes.md

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: OBS plugin ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
